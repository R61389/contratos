<section
  #sectionEl
  class="relative overflow-hidden border-t border-border-dark/60 py-20"
  (mouseenter)="pause()"
  (mouseleave)="resume()"
  (focusin)="pause()"
  (focusout)="resume()"
>
  <!-- Layer 0 — Background -->
  <div class="pointer-events-none absolute inset-0 z-0 bg-gradient-to-b from-white/[0.02] to-transparent"></div>
  <div class="pointer-events-none absolute -left-24 top-1/2 z-0 h-[420px] w-[420px] -translate-y-1/2 rounded-full bg-[#9B7BF0]/15 blur-[90px]"></div>
  <div class="pointer-events-none absolute -right-24 top-1/3 z-0 h-[380px] w-[380px] rounded-full bg-[#F0B255]/15 blur-[90px]"></div>

  <!-- Layer 1 — Ambient -->
  <div class="pointer-events-none absolute inset-0 z-10">
    <div class="absolute left-[20%] top-10 h-[6px] w-[6px] animate-floatB rounded-full bg-[#F0B255] shadow-[0_0_18px_5px_rgba(240,178,85,0.5)]"></div>
    <div class="absolute bottom-10 right-[24%] h-[5px] w-[5px] animate-floatA rounded-full bg-[#9B7BF0] shadow-[0_0_16px_5px_rgba(155,123,240,0.5)]"></div>
  </div>

  <!-- Layer 2 — Content -->
  <div class="relative z-20 mx-auto max-w-[1180px] px-8">
    <div class="mb-10 flex items-end justify-between">
      <div>
        <p class="mb-2 text-[12px] font-bold uppercase tracking-[0.08em] text-white/35">En tendencia esta semana</p>
        <h2 class="font-display text-[28px] font-bold text-white">Proveedores en acción</h2>
      </div>

      <!-- Layer 3 — Interaction: arrows -->
      <div class="hidden gap-2 sm:flex">
        <button
          type="button"
          (click)="prev()"
          aria-label="Proveedor anterior"
          class="flex h-11 w-11 items-center justify-center rounded-full border border-border-dark text-white/70 transition hover:bg-white/5 hover:text-white"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <button
          type="button"
          (click)="next()"
          aria-label="Siguiente proveedor"
          class="flex h-11 w-11 items-center justify-center rounded-full border border-border-dark text-white/70 transition hover:bg-white/5 hover:text-white"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>
    </div>

    <div class="overflow-hidden rounded-lg border border-border-dark">
      <div #trackEl class="flex will-change-transform">
        <div #cardsHost class="contents">
          @for (p of providers; track p.name) {
            <article class="w-full flex-none bg-gradient-to-br p-8 opacity-0 sm:flex sm:items-center sm:gap-10 sm:p-10" [class]="p.gradient">
              <div class="mb-6 h-[180px] w-full flex-none rounded-md bg-white/5 ring-1 ring-inset ring-white/10 sm:mb-0 sm:h-[220px] sm:w-[300px]"></div>
              <div class="min-w-0">
                <span class="chip !border-white/15" [style.color]="p.accent">{{ p.category }}</span>
                <h3 class="mt-4 font-display text-2xl font-semibold text-white">{{ p.name }}</h3>
                <p class="mt-2 max-w-md text-[14px] leading-relaxed text-white/55">{{ p.blurb }}</p>
                <div class="mt-5 flex items-center gap-4">
                  <span class="flex gap-0.5" [style.color]="p.accent">
                    @for (s of starsArray(p.rating); track $index) {
                      <svg viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5"><path d="M10 1l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.2L4.6 17.3l1.3-6L1.3 7.2l6.1-.6L10 1Z" /></svg>
                    }
                  </span>
                  <span class="text-[13px] text-white/40">{{ p.priceFrom }}</span>
                </div>
                <a href="#" class="btn-primary mt-6 !px-5 !py-2.5 !text-[13px]">Ver perfil</a>
              </div>
            </article>
          }
        </div>
      </div>
    </div>

    <!-- Layer 3 — Interaction: dots -->
    <div class="mt-6 flex items-center justify-center gap-2" role="group" aria-label="Selector de proveedor destacado">
      @for (p of providers; track p.name; let i = $index) {
        <button
          type="button"
          [attr.aria-label]="'Ver ' + p.name"
          [attr.aria-current]="active() === i ? 'true' : null"
          (click)="goTo(i)"
          class="h-2.5 rounded-full transition-all duration-300"
          [class.w-7]="active() === i"
          [class.w-2.5]="active() !== i"
          [class.bg-white]="active() === i"
          [class.bg-white/20]="active() !== i"
        ></button>
      }
    </div>
  </div>
</section>
